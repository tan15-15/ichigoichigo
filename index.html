<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ベトナム暮らし、ベトナム語は今日も🍓一期一語🍓</title>
    <style>
        :root {
            --primary-color: #e63946;
            --bg-color: #fdf2f4;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin: 10px 0;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }

        nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
            max-width: 500px;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        nav button {
            background-color: #fff;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-weight: bold;
            cursor: pointer;
        }

        nav button.active {
            background-color: var(--primary-color);
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .word-info {
            display: flex;
            flex-direction: column;
        }

        .vi-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .jp-text {
            font-size: 0.95rem;
            color: #4a4a4a;
            margin-top: 4px;
        }

        .audio-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .audio-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>🍓一期一語🍓</h1>
        <div class="subtitle">南部ベトナム語 音声学習ガイド</div>
    </header>

    <nav id="category-nav">
        <button class="active" onclick="filterCategory('all')">すべて</button>
        <button onclick="filterCategory('母音')">母音</button>
        <button onclick="filterCategory('子音')">子音</button>
        <button onclick="filterCategory('動詞')">動詞</button>
        <button onclick="filterCategory('名詞')">名詞</button>
        <button onclick="filterCategory('日常会話')">日常会話</button>
    </nav>

    <div class="container" id="word-list"></div>

    <script>
        const words = [
            { vi: "Xin chào", jp: "こんにちは", cat: "日常会話" },
            { vi: "Cảm ơn", jp: "ありがとう", cat: "日常会話" },
            { vi: "Ăn", jp: "食べる", cat: "動詞" },
            { vi: "Uống", jp: "飲む", cat: "動詞" },
            { vi: "Cơm", jp: "ご飯", cat: "名詞" },
            { vi: "Nước", jp: "水", cat: "名詞" },
            { vi: "a", jp: "母音 [a]", cat: "母音" },
            { vi: "b", jp: "子音 [b]", cat: "子音" }
        ];

        function playAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 連続タップ時の詰まりを防止
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'vi-VN'; // ベトナム語（南部アクセント優先）
                utterance.rate = 0.9; // 少しゆっくり再生
                window.speechSynthesis.speak(utterance);
            } else {
                alert("お使いのブラウザは音声読み上げに対応していません。");
            }
        }

        function renderWords(category) {
            const listContainer = document.getElementById("word-list");
            listContainer.innerHTML = "";

            const filtered = category === 'all' 
                ? words 
                : words.filter(w => w.cat === category);

            filtered.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="word-info">
                        <div class="vi-text">${item.vi}</div>
                        <div class="jp-text">${item.jp}</div>
                    </div>
                    <button class="audio-btn" onclick="playAudio('${item.vi}')">🔊</button>
                `;
                listContainer.appendChild(card);
            });
        }

        function filterCategory(cat) {
            const buttons = document.querySelectorAll("#category-nav button");
            buttons.forEach(btn => btn.classList.remove("active"));
            event.target.classList.add("active");
            renderWords(cat);
        }

        // 初期表示
        renderWords('all');
    </script>
</body>
</html>
