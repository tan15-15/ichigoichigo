<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一期一語（いちごいちご） - ベトナム語学習アプリ</title>
<style>
  :root {
    --primary: #d90429;
    --primary-hover: #ef233c;
    --bg-color: #f8f9fa;
    --card-bg: #ffffff;
    --text-main: #2b2d42;
    --text-muted: #8d99ae;
    --border-color: #edf2f4;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    line-height: 1.6;
    padding-bottom: 60px;
  }

  header {
    background-color: var(--primary);
    color: white;
    text-align: center;
    padding: 24px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  header p {
    font-size: 0.9rem;
    opacity: 0.9;
  }

  nav {
    display: flex;
    overflow-x: auto;
    background-color: #ffffff;
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 100;
    -webkit-overflow-scrolling: touch;
  }

  nav button {
    flex: 0 0 auto;
    padding: 12px 18px;
    border: none;
    background: none;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }

  nav button.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }

  .container {
    max-width: 800px;
    margin: 20px auto 0;
    padding: 0 16px;
  }

  .page {
    display: none;
  }

  .page.active {
    display: block;
  }

  .section-title {
    font-size: 1.3rem;
    color: var(--text-main);
    margin-bottom: 16px;
    padding-left: 8px;
    border-left: 4px solid var(--primary);
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .card {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }

  .vi-text {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--primary);
  }

  .ja-text {
    font-size: 0.95rem;
    color: var(--text-main);
    margin-bottom: 8px;
  }

  .desc-text {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .example-box {
    background-color: #f1f3f5;
    border-radius: 8px;
    padding: 10px;
    margin-top: 8px;
    font-size: 0.88rem;
  }

  .example-vi {
    font-weight: 600;
    color: var(--text-main);
  }

  .example-ja {
    color: #495057;
  }

  .audio-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background-color: #f8f9fa;
    border: 1px solid #ced4da;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-main);
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
    align-self: flex-start;
    -webkit-tap-highlight-color: transparent;
  }

  .audio-btn:active {
    background-color: #e9ecef;
    transform: scale(0.98);
  }

  .link-btn {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-decoration: underline;
    margin-top: 4px;
    display: inline-block;
  }

  footer {
    text-align: center;
    padding: 20px;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 4px;
  }
</style>
</head>
<body>

<header>
  <h1>🍓一期一語🍓</h1>
  <p>【いちごいちご】ベトナム語単語＆例文集</p>
</header>

<nav id="nav">
  <button class="active" onclick="switchPage('vowels')">母音</button>
  <button onclick="switchPage('tones')">声調</button>
  <button onclick="switchPage('consonants')">子音</button>
  <button onclick="switchPage('verbs')">動詞</button>
  <button onclick="switchPage('nouns')">名詞</button>
  <button onclick="switchPage('grammar')">文法</button>
  <button onclick="switchPage('conversation')">会話</button>
</nav>

<div class="container">
  <!-- 母音ページ -->
  <div id="vowels" class="page active">
    <h2 class="section-title">母音一覧</h2>
    <div class="card-grid" id="vowels-container"></div>
  </div>

  <!-- 声調ページ -->
  <div id="tones" class="page">
    <h2 class="section-title">声調の基本</h2>
    <div class="card-grid" id="tones-container"></div>
  </div>

  <!-- 子音ページ -->
  <div id="consonants" class="page">
    <h2 class="section-title">子音一覧</h2>
    <div class="card-grid" id="consonants-container"></div>
  </div>

  <!-- 動詞ページ -->
  <div id="verbs" class="page">
    <h2 class="section-title">基本動詞</h2>
    <div class="card-grid" id="verbs-container"></div>
  </div>

  <!-- 名詞ページ -->
  <div id="nouns" class="page">
    <h2 class="section-title">基本名詞</h2>
    <div class="card-grid" id="nouns-container"></div>
  </div>

  <!-- 文法ページ -->
  <div id="grammar" class="page">
    <h2 class="section-title">基本文法</h2>
    <div class="card-grid" id="grammar-container"></div>
  </div>

  <!-- 会話ページ -->
  <div id="conversation" class="page">
    <h2 class="section-title">日常会話</h2>
    <div class="card-grid" id="conv-container"></div>
  </div>
</div>

<footer>
  <p>© 🍓一期一語🍓 All Rights Reserved.</p>
</footer>

<script>
  // データ定義
  const vowelsData = [

    { vi: "ă", ja: "ア（短く）", desc: "口を大きく開けて短く「ア」" },
    { vi: "â", ja: "ア（曖昧に）", desc: "口をあまり開けずに曖昧に「ア」" },
    { vi: "e", ja: "エ", desc: "口を横に広げて「エ」" },
    { vi: "ê", ja: "エー", desc: "口を狭くして日本語の「エ」に近い音" },
    { vi: "i", ja: "イー", desc: "日本語の「イ」よりも口を強く引く" },
    { vi: "y", ja: "イー（長め）", desc: "iと同じ発音。綴り上の区別" },
    { vi: "o", ja: "オ", desc: "口を丸く大きく開けて「オ」" },
    { vi: "ô", ja: "オー", desc: "口をすぼめて「オ」" },
    { vi: "ơ", ja: "アー／オーの中間", desc: "力を抜いて曖昧に発音" },
    { vi: "u", ja: "ウー", desc: "唇を強く突き出して「ウ」" },

  const tonesData = [

    { vi: "á", ja: "鋭調（Thanh sắc）", desc: "一気に高く上げる音" },

    { vi: "ã", ja: "転調（Thanh ngã）", desc: "高めで喉を詰まらせるように跳ね上げる音" },
    { vi: "ạ", ja: "重調（Thanh nặng）", desc: "喉を詰めて短く低く落とす音" }
  ];

  const consonantsData = [
    { vi: "b", ja: "B音", desc: "日本語の「バ行」に近い" },
    { vi: "c / k / q", ja: "K音", desc: "日本語の「カ行」に近い" },
    { vi: "ch / tr", ja: "CH/TR音", desc: "「チャ行」に近い（南部ではtrはそり舌）" },
    { vi: "d / gi / r", ja: "D/GI/R音", desc: "南部では「ヤ行」に近い発音になる" },

    { vi: "g / gh", ja: "G音", desc: "日本語の「ガ行」に近い" },
    { vi: "h", ja: "H音", desc: "日本語の「ハ行」に近い" },
    { vi: "l", ja: "L音", desc: "舌先を上の歯茎につけるL音" },
    { vi: "m", ja: "M音", desc: "日本語の「マ行」に近い" },
    { vi: "n", ja: "N音", desc: "日本語の「ナ行」に近い" },
    { vi: "ng / ngh", ja: "NG音", desc: "鼻に抜ける「ンガ」の音" },
    { vi: "nh", ja: "NH音", desc: "日本語の「ニャ行」に近い" },
    { vi: "p", ja: "P音", desc: "語頭では外来語のみ。「パ行」" },
    { vi: "ph", ja: "PH音", desc: "英語のFの音。上の歯で下唇を噛む" },
    { vi: "s / x", ja: "S/X音", desc: "日本語の「サ行」に近い" },

    { vi: "th", ja: "TH音", desc: "息を強く出す息の混じったT音" },
    { vi: "v", ja: "V音", desc: "南部では「ヤ行」に近くなることがある" }
  ];

  const verbsData = [
    { vi: "ăn", ja: "食べる", exVi: "Min ăn cơm.", exJa: "Minはご飯を食べる。" },
    { vi: "uống", ja: "飲む", exVi: "Min uống cà phê.", exJa: "Minはコーヒーを飲む。" },
    { vi: "đi", ja: "行く", exVi: "Min đi chợ.", exJa: "Minは市場に行く。" },
    { vi: "về", ja: "帰る", exVi: "Min về nhà.", exJa: "Minは家に帰る。" },
    { vi: "làm", ja: "する・作る", exVi: "Min làm việc.", exJa: "Minは仕事をする。" },
    { vi: "học", ja: "学ぶ・勉強する", exVi: "Min học tiếng Việt.", exJa: "Minはベトナム語を勉強する。" },
    { vi: "mua", ja: "買う", exVi: "Min mua nước.", exJa: "Minは水を買う。" },
    { vi: "bán", ja: "売る", exVi: "Min bán trà.", exJa: "Minはお茶を売る。" }
  ];

  const nounsData = [
    { vi: "cơm", ja: "ご飯・食事", exVi: "Ăn cơm chưa?", exJa: "もうご飯食べた？" },
    { vi: "nước", ja: "水・国", exVi: "Cho tôi nước.", exJa: "私に水をください。" },
    { vi: "cà phê", ja: "コーヒー", exVi: "Cà phê sữa đá", exJa: "アイス練乳入りコーヒー" },
    { vi: "chợ", ja: "市場", exVi: "Đi chợ mua đồ.", exJa: "市場へ買い出しに行く。" },
    { vi: "nhà", ja: "家", exVi: "Nhà tôi ở đây.", exJa: "私の家はここです。" },
    { vi: "tiền", ja: "お金", exVi: "Bao nhiêu tiền?", exJa: "いくらですか？" }
  ];

  const grammarData = [
    { vi: "Chủ ngữ + Động từ + Tân ngữ", ja: "基本語順 (S + V + O)", desc: "英語と同じ主語＋動詞＋目的語の順番です。", exVi: "Tôi yêu Việt Nam.", exJa: "私はベトナムを愛しています。" },
    { vi: "Danh từ + Tính từ", ja: "修飾の語順 (名詞 ＋ 形容詞)", desc: "形容詞や修飾語は、修飾したい名詞の後ろに置きます。", exVi: "Cà phê ngon", exJa: "美味しいコーヒー" },
    { vi: "Không + Động từ", ja: "否定形 (Không ＋ 動詞)", desc: "動詞や形容詞の前に không を置くと否定になります。", exVi: "Tôi không biết.", exJa: "私は知りません。" },
    { vi: "Có ... không?", ja: "疑問形 (Có ＋ 動詞 ＋ không?)", desc: "文末に không をつけるか、có ... không で挟むと疑問文になります。", exVi: "Bạn có khỏe không?", exJa: "お元気ですか？" }
  ];

  const convData = [
    { vi: "Xin chào!", ja: "こんにちは！", desc: "いつでも使える挨拶" },
    { vi: "Cảm ơn bạn.", ja: "ありがとう。", desc: "感謝を伝える表現" },
    { vi: "Xin lỗi.", ja: "ごめんなさい / すみません", desc: "謝罪や呼びかけ" },
    { vi: "Bao nhiêu tiền?", ja: "いくらですか？", desc: "買い物で必須のフレーズ" },
    { vi: "Cái này là gì?", ja: "これは何ですか？", desc: "物事を尋ねるとき" },
    { vi: "Ngon lắm!", ja: "とても美味しい！", desc: "食事中の褒め言葉" }
  ];

  // グローバル音声保持変数
  let currentAudio = null;

  /**
   * 共通音声再生関数 (playAudio)
   * iPhone Safariでの即時再生を確実にするため、クリックイベント同調でAudioインスタンスを生成・再生します。
   */
  function playAudio(text) {
    if (!text) return;

    // 現在再生中の音声があれば即座に停止
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }

    // Google Translate TTS URL生成
    const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encodeURIComponent(text)}`;

    // ユーザー操作イベント内で直接Audio要素を作ってplay()を開始
    const audio = new Audio(ttsUrl);
    currentAudio = audio;

    // エラーハンドリング（フォールバックとしてSpeechSynthesisをトリガー）
    audio.onerror = function() {
      fallbackSpeechSynthesis(text);
    };

    const playPromise = audio.play();

    if (playPromise !== undefined) {
      playPromise.catch(function(error) {
        console.warn("Audio play failed, switching to SpeechSynthesis fallback:", error);
        fallbackSpeechSynthesis(text);
      });
    }
  }

  /**
   * SpeechSynthesis フォールバック機能
   */
  function fallbackSpeechSynthesis(text) {
    if (!('speechSynthesis' in window)) return;

    try {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'vi-VN';
      utterance.rate = 0.85;

      const voices = window.speechSynthesis.getVoices();
      const viVoice = voices.find(v => v.lang && (v.lang === 'vi-VN' || v.lang.startsWith('vi')));
      if (viVoice) {
        utterance.voice = viVoice;
      }

      window.speechSynthesis.speak(utterance);
    } catch (e) {
      console.error("SpeechSynthesis error:", e);
    }
  }

  // 外部リンク生成
  function getExternalTtsUrl(text) {
    return `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encodeURIComponent(text)}`;
  }

  // ページ切り替え
  function switchPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    
    document.getElementById(pageId).classList.add('active');
    
    const activeBtn = Array.from(document.querySelectorAll('nav button')).find(
      btn => btn.getAttribute('onclick').includes(pageId)
    );
    if (activeBtn) activeBtn.classList.add('active');

    window.scrollTo(0, 0);
  }

  // カード描画関数
  function renderVowels() {
    const container = document.getElementById('vowels-container');

        <div>
          <div class="card-header">
            <span class="vi-text">${item.vi}</span>
          </div>
          <div class="ja-text">${item.ja}</div>
          <div class="desc-text">${item.desc}</div>
        </div>
        <div>
          <button class="audio-btn" onclick="playAudio('${item.vi}')">🔊 母音を聴く</button>
          <div>
            <a class="link-btn" href="${getExternalTtsUrl(item.vi)}" target="_blank" rel="noopener">🔗 音声URLを開く</a>
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderTones() {

    `).join('');
  }

  function renderGrammar() {
    const container = document.getElementById('grammar-container');
    container.innerHTML = grammarData.map(item => `
      <div class="card">
        <div>
          <div class="card-header">
            <span class="vi-text">${item.vi}</span>
          </div>
          <div class="ja-text">${item.ja}</div>
          <div class="desc-text">${item.desc}</div>
          <button class="audio-btn" onclick="playAudio('${item.vi}')">🔊 文法項目を再生</button>
          <div>
            <a class="link-btn" href="${getExternalTtsUrl(item.vi)}" target="_blank" rel="noopener">🔗 音声URLを開く</a>

          <div class="example-box">

        </div>
      </div>
    `).join('');
  }

  function renderConversation() {
    const container = document.getElementById('conv-container');
    container.innerHTML = convData.map(item => `
      <div class="card">
        <div>
          <div class="card-header">
            <span class="vi-text">${item.vi}</span>
          </div>
          <div class="ja-text">${item.ja}</div>
          <div class="desc-text">${item.desc}</div>
        </div>
        <div>
          <button class="audio-btn" onclick="playAudio('${item.vi}')">🔊 会話を再生</button>
          <div>
            <a class="link-btn" href="${getExternalTtsUrl(item.vi)}" target="_blank" rel="noopener">🔗 音声URLを開く</a>
          </div>
        </div>
      </div>
    `).join('');
  }

  // 初期ロード時レンダリング
  window.addEventListener('DOMContentLoaded', () => {
    renderVowels();
    renderTones();
    renderConsonants();
    renderVerbs();
    renderNouns();
    renderGrammar();
    renderConversation();
  });
</script>
</body>
</html>
