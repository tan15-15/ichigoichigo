name: Add or Update Vietnamese Lesson

on:
  workflow_dispatch:
    inputs:
      lesson_html:
        description: 'メタデータ付きの完全版HTMLコードをここに丸ごと貼り付けてください'
        required: true
        type: string

jobs:
  process-lesson:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run processor
        env:
          LESSON_HTML: ${{ inputs.lesson_html }}
        run: |
          python scripts/process_lesson.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add *.html lessons.js images/
          git diff --staged --quiet || git commit -m "Auto-sync lesson and vocabulary"
          git push
