name: Add Vietnamese Lesson and Sync Archive

on:
  workflow_dispatch:
    inputs:
      lesson_json:
        description: "追加するレッスン内容（JSONを丸ごと貼り付け。空でも同期のみ実行可）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync-and-add:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Run update script
        env:
          LESSON_JSON: "${{ inputs.lesson_json }}"
        run: python3 update_lessons.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "変更はありません"
          else
            git commit -m "Batch update archive links and archive page"
            git push
          fi
