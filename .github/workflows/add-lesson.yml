name: Add Vietnamese Lesson

on:
  workflow_dispatch:
    inputs:
      lesson_json:
        description: "追加するレッスン内容（JSONを丸ごと貼り付け）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Add lesson
        env:
          LESSON_JSON: ${{ inputs.lesson_json }}
        run: |
          python3 <<'PY'
          import json
          import re
          import os
          from pathlib import Path

          raw = os.environ.get("LESSON_JSON", "").strip()
          try:
              lesson = json.loads(raw)
          except json.JSONDecodeError as e:
              raise SystemExit(f"JSONの形式が正しくありません: {e}")

          required = [
              "date", "title", "scene", "vietnamese",
              "translation", "words", "mainWord", "mainMeaning"
          ]
          missing = [key for key in required if key not in lesson]
          if missing:
              raise SystemExit("不足している項目: " + ", ".join(missing))

          if not isinstance(lesson["words"], list):
              raise SystemExit("words は単語と意味のリストにしてください")

          lesson.setdefault("extraWords", [])

          path = Path("lessons.js")
          content = path.read_text(encoding="utf-8")

          match = re.search(r'const\s+lessons\s*=\s*\[', content)
          if not match:
              raise SystemExit("lessons.js の配列が見つかりません")

          end_marker = "\n];\n\nfunction speakVietnamese"
          insert_at = content.find(end_marker, match.end())
          if insert_at < 0:
              raise SystemExit("lessons.js の配列の終わりが見つかりません")

          existing = content[match.end():insert_at]

          if (
              json.dumps(lesson["date"], ensure_ascii=False) in existing
              and json.dumps(lesson["title"], ensure_ascii=False) in existing
          ):
              print("同じ日付とタイトルのレッスンがあるため、追加をスキップします。")
              raise SystemExit(0)

          separator = (
              "" if not existing.strip() or existing.rstrip().endswith(",")
              else ","
          )
          new_entry = json.dumps(lesson, ensure_ascii=False, indent=2)

          updated = (
              content[:insert_at]
              + separator
              + "\n  "
              + new_entry.replace("\n", "\n  ")
              + "\n"
              + content[insert_at:]
          )

          path.write_text(updated, encoding="utf-8")
          print("レッスンを追加しました")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons.js
          if git diff --cached --quiet; then
            echo "変更はありません"
          else
            git commit -m "Add Vietnamese lesson"
            git push
          fi
