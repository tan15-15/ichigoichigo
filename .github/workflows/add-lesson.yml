name: Add Vietnamese Lesson

on:
  workflow_dispatch:
    inputs:
      lesson_json:
        description: "追加するレッスン内容（JSONを丸ごと貼り付け）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Add lesson and sync HTML
        env:
          LESSON_JSON: ${{ inputs.lesson_json }}
        run: |
          python3 - << 'EOF'
          import json, re, os
          from pathlib import Path

          raw = os.environ.get("LESSON_JSON", "").strip()
          if raw:
              raw = raw.translate(str.maketrans({"“": '"', "”": '"', "„": '"', "‟": '"', "‘": "'", "’": "'", "‚": "'", "‛": "'"}))
              try:
                  lesson = json.loads(raw)
                  if "date" in lesson and "title" in lesson:
                      path = Path("lessons.js")
                      content = path.read_text(encoding="utf-8")
                      match = re.search(r'const\s+lessons\s*=\s*\[', content)
                      if match:
                          end_marker = "\n];\n\nconst vocabulary = ["
                          insert_at = content.find(end_marker, match.end())
                          if insert_at > 0:
                              existing = content[match.end():insert_at]
                              if lesson["date"] not in existing:
                                  separator = "" if not existing.strip() or existing.rstrip().endswith(",") else ","
                                  new_entry = json.dumps(lesson, ensure_ascii=False, indent=2)
                                  updated = content[:insert_at] + separator + "\n  " + new_entry.replace("\n", "\n  ") + "\n" + content[insert_at:]
                                  path.write_text(updated, encoding="utf-8")
              except Exception as e:
                  print(f"JSON処理スキップ: {e}")

          content = Path("lessons.js").read_text(encoding="utf-8")
          match_lessons = re.search(r'const\s+lessons\s*=\s*(\[.*?\]);?\s*\n', content, re.DOTALL)
          lessons_list = json.loads(match_lessons.group(1)) if match_lessons else []

          for l in lessons_list:
              date_str = l.get("date")
              title_str = l.get("title", "")
              if not date_str:
                  continue
              filename = f"lesson-{date_str}.html"
              html_code = f"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>{title_str} - 一期一語</title>\n    <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n    <div id=\"app\" data-date=\"{date_str}\"></div>\n    <script src=\"lessons.js\"></script>\n    <script src=\"app.js\"></script>\n</body>\n</html>"
              Path(filename).write_text(html_code, encoding="utf-8")
              print(f"生成: {filename}")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -maxdepth 1 -name "Lesson-*.html" -exec git rm -f {} \; || true
          git add .
          if git diff --cached --quiet; then
            echo "変更はありません"
          else
            git commit -m "Auto sync lessons and lowercase html files"
            git push
          fi
