name: Add Vietnamese Lesson

on:
  workflow_dispatch:
    inputs:
      lesson_json:
        description: "追加するレッスン内容（JSONを丸ごと貼り付け）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Add lesson and generate HTML
        env:
          LESSON_JSON: ${{ inputs.lesson_json }}
        run: |
          python3 -c '
          import json, re, os
          from pathlib import Path

          raw = os.environ.get("LESSON_JSON", "").strip()
          raw = raw.translate(str.maketrans({"“": "\"", "”": "\"", "„": "\"", "‟": "\"", "‘": "\'", "’": "\'", "‚": "\'", "‛": "\'"}))
          lesson = json.loads(raw)
          date_str = lesson["date"]

          path = Path("lessons.js")
          content = path.read_text(encoding="utf-8")
          match = re.search(r"const\s+lessons\s*=\s*\[", content)
          end_marker = "\n];\n\nconst vocabulary = ["
          insert_at = content.find(end_marker, match.end())
          
          existing = content[match.end():insert_at]
          if json.dumps(lesson["date"], ensure_ascii=False) not in existing:
              separator = "" if not existing.strip() or existing.rstrip().endswith(",") else ","
              new_entry = json.dumps(lesson, ensure_ascii=False, indent=2)
              updated = content[:insert_at] + separator + "\n  " + new_entry.replace("\n", "\n  ") + "\n" + content[insert_at:]
              path.write_text(updated, encoding="utf-8")

          html_filename = f"lesson-{date_str}.html"
          html_path = Path(html_filename)
          if not html_path.exists():
              template_html = f"""<!DOCTYPE html>
          <html lang=\"ja\">
          <head>
              <meta charset=\"UTF-8\">
              <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
              <title>{lesson[\"title\"]} - 一期一語</title>
              <link rel=\"stylesheet\" href=\"style.css\">
          </head>
          <body>
              <div id=\"app\" data-date=\"{date_str}\"></div>
              <script src=\"lessons.js\"></script>
              <script src=\"app.js\"></script>
          </body>
          </html>
          """
              html_path.write_text(template_html, encoding="utf-8")
          '

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -maxdepth 1 -name "Lesson-*.html" -exec git rm -f {} \; || true
          git add .
          if git diff --cached --quiet; then
            echo "変更はありません"
          else
            git commit -m "Add Vietnamese lesson and ensure lowercase html filename"
            git push
          fi
