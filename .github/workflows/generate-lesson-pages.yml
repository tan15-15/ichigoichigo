name: Generate Vietnamese Lesson Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lessons.js'
      - '.github/workflows/generate-lesson-pages.yml'

permissions:
  contents: write

jobs:
  generate-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate individual lesson pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('lessons.js', 'utf8');
          const marker = source.match(/const\s+lessons\s*=\s*\[/);
          if (!marker) throw new Error('lessons array not found');
          const start = source.indexOf('[', marker.index);
          let depth = 0, quote = '', escaped = false, end = -1;
          for (let i = start; i < source.length; i++) {
            const c = source[i];
            if (quote) {
              if (escaped) escaped = false;
              else if (c === '\\') escaped = true;
              else if (c === quote) quote = '';
              continue;
            }
            if (c === '"' || c === "'" || c === '`') {
              quote = c;
              continue;
            }
            if (c === '[') depth++;
            if (c === ']' && --depth === 0) {
              end = i + 1;
              break;
            }
          }
          if (end < 0) throw new Error('Could not read lessons array');
          const lessons = vm.runInNewContext(source.slice(start, end));
          const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;'
          }[c]));
          const slug = date => {
            const m = String(date).match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
            if (!m) throw new Error('Unexpected lesson date: ' + date);
            return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
          };
          const audio = phrase =>
            `<button class="audio" data-speak="${esc(phrase)}">🔊 音声を聞く</button>`;
          for (const lesson of lessons) {
            const sections = (lesson.articleSections || []).map(section =>
              `<section><h2>${esc(section.heading)}</h2>${(section.paragraphs || []).map(p => `<p>${esc(p)}</p>`).join('')}${(section.examples || []).map(ex => `<div class="example"><p class="vi">${esc(ex.v)}</p>${audio(ex.v)}<p>${esc(ex.j)}</p><p class="words">${esc(ex.w)}</p></div>`).join('')}</section>`
            ).join('');
            const words = (lesson.words || []).map(w =>
              `<li><strong>${esc(w[0])}</strong> — ${esc(w[1])}</li>`
            ).join('');
            const extras = (lesson.extraWords || []).map(w =>
              `<li><strong>${esc(w[0])}</strong> — ${esc(w[1])}</li>`
            ).join('');
            const review = `<section><h2>🍓 今日の復習</h2><p class="vi">${esc(lesson.vietnamese)}</p>${audio(lesson.vietnamese)}<p>${esc(lesson.translation)}</p><ul>${words}</ul></section>`;
            const otherLessons = lessons
              .filter(item => slug(item.date) !== slug(lesson.date))
              .slice()
              .reverse()
              .map(item =>
                '<a class="archive-link" href="./lesson-' +
                slug(item.date) + '.html">' +
                esc(item.date) + '｜' + esc(item.title) + '</a>'
              ).join('');
            const html = `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(lesson.title)}｜ベトナム暮らし、ベトナム語は今日も🍓一期一語🍓</title><meta name="description" content="${esc(lesson.title)}。南部ベトナム語初心者向けの日常会話レッスン。日本語訳・単語の意味・音声付きで学びます。"><link rel="canonical" href="https://tan15-15.github.io/ichigoichigo/lesson-${slug(lesson.date)}.html"><style>*{box-sizing:border-box}body{margin:0;background:#fff8fa;color:#45363a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.85}.wrap{max-width:780px;margin:auto;padding:18px}header,.panel,section{background:white;border:1px solid #f3d5df;border-radius:18px;padding:18px;margin:14px 0}header{text-align:center}a{color:#b52d5b}.brand{font-size:14px;color:#b52d5b}.date{color:#876d75;font-size:14px}.scene{background:#fff0f4;padding:14px;border-radius:12px}.vi{font-size:22px;font-weight:700;color:#a82150}.audio{background:#c93667;color:white;border:0;border-radius:22px;padding:9px 15px;font-size:15px;cursor:pointer}.words{font-size:14px;color:#765e67}h1{font-size:24px;line-height:1.5}h2{font-size:19px;color:#a82150}li{margin:6px 0}.nav{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:18px}.archive{background:#fff0f4;border:1px solid #f3d5df;border-radius:18px;padding:18px;margin:14px 0}.archive h2{margin-top:0}.archive-links{display:flex;flex-direction:column;gap:8px}.archive-link{display:block;background:white;border:1px solid #f3d5df;border-radius:10px;padding:9px 12px;text-decoration:none}.archive-link:hover{background:#ffe2eb}</style></head><body><main class="wrap"><header><div class="brand">ベトナム暮らし、ベトナム語は今日も🍓一期一語🍓</div><p class="date">${esc(lesson.date)}</p><h1>${esc(lesson.sceneIcon || '🍓')} ${esc(lesson.title)}</h1><p>ゼロから、少しずつ。日常会話で使える南部ベトナム語。</p></header><div class="panel"><h2>${esc(lesson.sceneTitle || '今日の出来事')}</h2><p class="scene">${esc(lesson.scene || '')}</p><p class="vi">${esc(lesson.vietnamese)}</p>${audio(lesson.vietnamese)}<p>${esc(lesson.translation)}</p><p class="words">${esc((lesson.words || []).map(w => w[0] + '＝' + w[1]).join(' ／ '))}</p></div>${sections}<section><h2>📚 いっしょに覚える単語</h2><ul>${words}${extras}</ul></section>${review}<section class="archive"><h2>📅 別の日のブログ</h2><p>ほかの日のベトナム語日記も読んでみよう！🍓</p><div class="archive-links">${otherLessons || '<p>ほかの日のブログはまだありません。</p>'}</div></section><nav class="nav"><a href="./index.html">🍓 トップページへ</a><a href="./words.html">📚 単語帳へ</a></nav></main><script>function speak(t){if(!('speechSynthesis' in window)){alert('このブラウザでは音声再生に対応していません');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=0.78;speechSynthesis.speak(u)}document.addEventListener('click',e=>{const b=e.target.closest('[data-speak]');if(b)speak(b.dataset.speak)});</script></body></html>`;
            fs.writeFileSync(`lesson-${slug(lesson.date)}.html`, html);
            console.log('Generated lesson-' + slug(lesson.date) + '.html');
          }
          NODE

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lesson-*.html
          if git diff --cached --quiet; then
            echo 'No page changes to commit.'
          else
            git commit -m "Generate individual Vietnamese lesson pages"
            git push
          fi
