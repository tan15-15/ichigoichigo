name: Add or Update Vietnamese Lesson

on:
  workflow_dispatch:
    inputs:
      lesson_json:
        description: "レッスン内容（JSONを丸ごと1回貼り付け）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-or-update-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update lesson data and only the target HTML page
        env:
          LESSON_JSON: ${{ inputs.lesson_json }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const input = JSON.parse(process.env.LESSON_JSON || '{}');
          const required = [
            'date', 'title', 'scene', 'vietnamese',
            'translation', 'words', 'mainWord', 'mainMeaning'
          ];

          for (const key of required) {
            if (!(key in input)) {
              throw new Error('JSONに必須項目がありません: ' + key);
            }
          }

          if (!Array.isArray(input.words)) {
            throw new Error('words は単語と意味の配列にしてください');
          }

          const dateMatch = String(input.date).match(
            /(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/
          );

          if (!dateMatch) {
            throw new Error('date は「2026年10月20日」の形式にしてください');
          }

          const [, year, month, day] = dateMatch;
          const isoDate =
            `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
          const pagePath = `lesson-${isoDate}.html`;

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `TARGET_PAGE=${pagePath}\n`
          );

          const esc = value => String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');

          const speak = value =>
            ` <button class="speak" type="button" data-text="${esc(value)}" onclick="speakVietnamese(this.dataset.text)">🔊 聴く</button>`;

          const viet = value =>
            `<p class="viet-card">${esc(value)}${speak(value)}</p>`;

          const renderPairs = items =>
            (Array.isArray(items) ? items : []).map(item => {
              const v = Array.isArray(item)
                ? item[0]
                : (item.v || item.word || item.vietnamese || '');

              const j = Array.isArray(item)
                ? item[1]
                : (item.j || item.meaning || item.translation || '');

              const w = Array.isArray(item)
                ? ''
                : (item.w || item.words || '');

              return `<div class="step-box">
                <p>${esc(v)}${speak(v)}</p>
                <p class="translation">${esc(j)}</p>${w ? `<p>${esc(w)}</p>` : ''}
              </div>`;
            }).join('\n');

          const sections = Array.isArray(input.articleSections)
            ? input.articleSections
            : [];

          const sectionsHtml = sections.map(section => {
            const heading = section.heading || section.title || '';

            const paragraphs = (section.paragraphs || []).map(p => {
              const value = String(p);

              const hasVietnamese =
                /[ăâđêôơưáàảãạắằẵặấầẩẫậéèẻẽẹếềểễệíìỉĩịóòỏõọốồổỗộớờởỡợúùúụứừửữựýỳỷỹỵ]/i.test(value);

              return `<p>${esc(value)}${hasVietnamese ? speak(value) : ''}</p>`;
            }).join('\n');

            const examples = (section.examples || []).map(ex =>
              `<div class="step-box">
                ${viet(ex.v || ex.vietnamese || '')}
                <p class="translation">${esc(ex.j || ex.translation || '')}</p>
                <p>${esc(ex.w || ex.words || '')}</p>
              </div>`
            ).join('\n');

            return `<section>
              <h2>${esc(heading)}</h2>
              ${paragraphs}${examples}
            </section>`;
          }).join('\n');

          const sIcon = input.sceneIcon ? input.sceneIcon : '🍓';
          const sTitle = input.sceneTitle ? input.sceneTitle : '今日の出来事';

          const articleHtml = `<article class="article">
            <p class="date">${esc(input.date)}</p>
            <h1>${esc(input.title)}</h1>

            <section class="step-box">
              <h2>${esc(sIcon)}${esc(sTitle)}</h2>
              <p>${esc(input.scene)}</p>
            </section>

            <section>
              <h2>🇻🇳 今日の一文</h2>
              ${viet(input.vietnamese)}
              <p class="translation">${esc(input.translation)}</p>
            </section>

            <section>
              <h2>🍓 今日の一語</h2>
              ${viet(input.mainWord)}
              <p class="translation">${esc(input.mainMeaning)}</p>
            </section>

            ${sectionsHtml}

            <section>
              <h2>📚 今日の単語</h2>
              ${renderPairs(input.words)}
            </section>

            ${input.extraWords?.length ? `
              <section>
                <h2>➕ 関連する言葉</h2>
                ${renderPairs(input.extraWords)}
              </section>` : ''}

            <section>
              <h2>🍓 今日の復習</h2>
              ${viet(input.vietnamese)}
              <p class="translation">${esc(input.translation)}</p>
              <p>${esc(input.mainWord)}＝${esc(input.mainMeaning)}</p>
            </section>
          </article>`;

          const templatePath = 'lesson-2026-10-03.html';
          if (!fs.existsSync(templatePath)) {
            throw new Error('HTMLテンプレートが見つかりません: ' + templatePath);
          }
          fs.copyFileSync(templatePath, pagePath);

          let html = fs.readFileSync(pagePath, 'utf8');

          const articleRegex =
            /<article\b[^>]*class=["'][^"']*\barticle\b[^"']*["'][^>]*>[\s\S]*?<\/article>/i;

          if (!articleRegex.test(html)) {
            throw new Error(
              `${pagePath} の記事部分を特定できません。`
            );
          }

          if (
            !fs.existsSync('site-banner.jpg') &&
            !/src=["']data:image\//i.test(html)
          ) {
            throw new Error('site-banner.jpg が見つかりません。');
          }

          html = html.replace(articleRegex, articleHtml);

          html = html.replace(
            /<title>[\s\S]*?<\/title>/i,
            `<title>${esc(input.title)}｜一期一語</title>`
          );

          fs.writeFileSync(pagePath, html, 'utf8');

          const lessonFile = 'lessons.js';
          const source = fs.readFileSync(lessonFile, 'utf8');

          const marker = source.match(/const\s+lessons\s*=\s*\[/);

          if (!marker) {
            throw new Error('lessons.js の lessons 配列が見つかりません');
          }

          const start = source.indexOf('[', marker.index);
          let depth = 0;
          let quote = '';
          let escaped = false;
          let end = -1;

          for (let i = start; i < source.length; i++) {
            const c = source[i];

            if (quote) {
              if (escaped) escaped = false;
              else if (c === '\\') escaped = true;
              else if (c === quote) quote = '';
              continue;
            }

            if (c === '"' || c === "'" || c === '`') {
              quote = c;
              continue;
            }

            if (c === '[') depth++;

            if (c === ']') {
              depth--;
              if (depth === 0) {
                end = i + 1;
                break;
              }
            }
          }

          if (end < 0) {
            throw new Error('lessons 配列の終わりが見つかりません');
          }

          const lessons = vm.runInNewContext(
            source.slice(start, end)
          );

          const index = lessons.findIndex(
            item => item.date === input.date
          );

          if (index >= 0) {
            lessons[index] = { ...lessons[index], ...input };
          } else {
            lessons.push({
              ...input,
              sceneIcon: sIcon,
              sceneTitle: sTitle,
              extraWords: input.extraWords || [],
              archiveWords: input.archiveWords ||
                input.words.slice(0, 5).map(item =>
                  Array.isArray(item)
                    ? item[0]
                    : (item.v || item.word || '')
                ),
              articleSections: input.articleSections || []
            });
          }

          fs.writeFileSync(
            lessonFile,
            source.slice(0, start) +
              JSON.stringify(lessons, null, 2) +
              source.slice(end),
            'utf8'
          );
          NODE

      - name: Commit and push only the requested date
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lessons.js "$TARGET_PAGE"

          if git diff --cached --quiet; then
            echo "変更はありません"
          else
            git commit -m "Add or update Vietnamese lesson"
            git push
          fi
