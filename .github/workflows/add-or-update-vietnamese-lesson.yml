name: Add or Update Vietnamese Lesson

on:
  workflow_dispatch:
    inputs:
      lesson_json:
        description: "レッスン内容（JSONを丸ごと1回貼り付け）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-or-update-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and Run Parser
        env:
          LESSON_JSON: ${{ inputs.lesson_json }}
        run: |
          echo "$LESSON_JSON" | base64 -w 0 > payload.b64

          node << 'EOF'
          const fs = require('fs');

          // 1. 入力データの復元
          const rawB64 = fs.readFileSync('payload.b64', 'utf8').trim();
          let rawStr = Buffer.from(rawB64, 'base64').toString('utf8').trim();
          rawStr = rawStr.replace(/\]\s*;?\s*$/, '').trim();
          if (rawStr.startsWith('[')) rawStr = rawStr.substring(1).trim();

          let input;
          try {
            input = JSON.parse(rawStr);
          } catch (e1) {
            const s = rawStr.indexOf('{');
            const e = rawStr.lastIndexOf('}');
            input = JSON.parse(rawStr.substring(s, e + 1));
          }

          // 2. 日付からファイル名決定
          const dateMatch = String(input.date || '').match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
          if (!dateMatch) throw new Error("日付形式が正しくありません");
          const [, y, m, d] = dateMatch;
          const isoDate = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
          const pagePath = `lesson-${isoDate}.html`;

          const esc = v => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
          const speak = v => ` <button class="speak" type="button" data-text="${esc(v)}" onclick="speakVietnamese(this.dataset.text)">🔊 聴く</button>`;
          const viet = v => `<p class="viet-card">${esc(v)}${speak(v)}</p>`;

          const renderPairs = items => (items || []).map(item => {
            const v = Array.isArray(item) ? item[0] : (item.v || item.word || '');
            const j = Array.isArray(item) ? item[1] : (item.j || item.meaning || '');
            const w = Array.isArray(item) ? '' : (item.w || '');
            return `<div class="step-box"><p>${esc(v)}${speak(v)}</p><p class="translation">${esc(j)}</p>${w ? `<p>${esc(w)}</p>` : ''}</div>`;
          }).join('\n');

          const sIcon = input.sceneIcon || '🚿';
          const sTitle = input.sceneTitle || '今日の出来事';

          const sectionsHtml = (input.articleSections || []).map(sec => {
            const heading = sec.heading || sec.title || '';
            const pList = (sec.paragraphs || []).map(p => p ? `<p>${esc(p)}</p>` : '<br>').join('\n');
            const exList = (sec.examples || []).map(ex => {
              const noteHtml = ex.w ? `<div style="margin-top:8px; padding:10px; background:#f9f9f9; border-left:4px solid #e74c3c; border-radius:4px; font-size:0.95em; line-height:1.6;">${esc(ex.w).replace(/\n/g, '<br>')}</div>` : '';
              return `<div class="step-box" style="margin-bottom:15px;">${viet(ex.v || '')}<p class="translation">${esc(ex.j || '')}</p>${noteHtml}</div>`;
            }).join('\n');
            return `<section><h2>${esc(heading)}</h2>${pList}${exList}</section>`;
          }).join('\n');

          const speechScript = `
          <script>
          function speakVietnamese(text) {
            if (!('speechSynthesis' in window)) {
              alert('お使いのブラウザは音声再生に対応していません。');
              return;
            }
            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'vi-VN';
            uttr.rate = 0.85;
            window.speechSynthesis.speak(uttr);
          }
          </script>`;

          const articleHtml = `<article class="article">
            <p class="date">${esc(input.date)}</p>
            <h1>${esc(input.title)}</h1>
            <section class="step-box">
              <h2>${esc(sIcon)}${esc(sTitle)}</h2>
              <p>${esc(input.scene)}</p>
            </section>
            <section>
              <h2>🇻🇳 今日の一文</h2>
              ${viet(input.vietnamese)}
              <p class="translation">${esc(input.translation)}</p>
            </section>
            <section>
              <h2>🍓 今日の一語</h2>
              ${viet(input.mainWord)}
              <p class="translation">${esc(input.mainMeaning)}</p>
            </section>
            ${sectionsHtml}
            <section>
              <h2>📚 今日の単語</h2>
              ${renderPairs(input.words)}
            </section>
            ${input.extraWords?.length ? `<section><h2>➕ 関連する言葉</h2>${renderPairs(input.extraWords)}</section>` : ''}
            <section>
              <h2>🍓 今日の復習</h2>
              ${viet(input.vietnamese)}
              <p class="translation">${esc(input.translation)}</p>
              <p>${esc(input.mainWord)}＝${esc(input.mainMeaning)}</p>
            </section>
          </article>
          ${speechScript}`;

          const templatePath = 'lesson-2026-10-03.html';
          if (!fs.existsSync(templatePath)) throw new Error('テンプレートが見つかりません');
          fs.copyFileSync(templatePath, pagePath);
          let html = fs.readFileSync(pagePath, 'utf8');

          const articleRegex = /<article\b[^>]*class=["'\x27][^"\x27]*\barticle\b[^"\x27]*["\x27][^>]*>[\s\S]*?<\/article>/i;
          html = html.replace(articleRegex, articleHtml);
          html = html.replace(/<title>[\s\S]*?<\/title>/i, `<title>${esc(input.title)}｜一期一語</title>`);
          fs.writeFileSync(pagePath, html, 'utf8');

          // 3. lessons.js の安全な読み込みと更新
          const lessonFile = 'lessons.js';
          let lessons = [];
          try {
            const source = fs.readFileSync(lessonFile, 'utf8');
            const matchLessons = source.match(/const\s+lessons\s*=\s*(\[[\s\S]*\]);?/);
            if (matchLessons && matchLessons[1]) {
              lessons = JSON.parse(matchLessons[1]);
            }
          } catch (err) {
            lessons = [];
          }

          const existingIndex = lessons.findIndex(item => item.date === input.date);
          if (existingIndex >= 0) {
            lessons[existingIndex] = { ...lessons[existingIndex], ...input };
          } else {
            lessons.push(input);
          }

          lessons.sort((a, b) => (b.date || '').replace(/[^0-9]/g, '').localeCompare((a.date || '').replace(/[^0-9]/g, '')));
          fs.writeFileSync(lessonFile, `const lessons = ${JSON.stringify(lessons, null, 2)};\n`, 'utf8');

          // 4. index.html（ブログ一覧ページ）のリストを自動更新
          const indexFile = 'index.html';
          if (fs.existsSync(indexFile)) {
            let indexHtml = fs.readFileSync(indexFile, 'utf8');
            const listHtml = lessons.map(lesson => {
              const dm = String(lesson.date || '').match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
              if (!dm) return '';
              const fn = `lesson-${dm[1]}-${dm[2].padStart(2, '0')}-${dm[3].padStart(2, '0')}.html`;
              return `<li><a href="./${fn}"><strong>${esc(lesson.date)}</strong>：${esc(lesson.title)}</a></li>`;
            }).join('\n');

            // index.html 内のリストエリア（<ul id="lesson-list"> など）を自動書き換え、なければarticle内や適当な位置に追加
            if (indexHtml.includes('id="lesson-list"')) {
              indexHtml = indexHtml.replace(/<ul[^>]*id="lesson-list"[^>]*>[\s\S]*?<\/ul>/i, `<ul id="lesson-list">\n${listHtml}\n</ul>`);
            } else {
              // リストコンテナがない場合は記事一覧セクションを挿入
              const listSection = `<div style="margin: 20px 0;"><ul id="lesson-list" style="list-style: none; padding: 0;">\n${listHtml}\n</ul></div>`;
              if (indexHtml.includes('</article>')) {
                indexHtml = indexHtml.replace(/(<\/article>)/i, `$1\n${listSection}`);
              }
            }
            fs.writeFileSync(indexFile, indexHtml, 'utf8');
          }

          // 5. 全記事にナビボタン挿入
          lessons.forEach((lesson, i) => {
            const dm = String(lesson.date || '').match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
            if (!dm) return;
            const targetFile = `lesson-${dm[1]}-${dm[2].padStart(2, '0')}-${dm[3].padStart(2, '0')}.html`;
            if (!fs.existsSync(targetFile)) return;

            let fileContent = fs.readFileSync(targetFile, 'utf8');
            const newer = i > 0 ? lessons[i - 1] : null;
            const older = i < lessons.length - 1 ? lessons[i + 1] : null;

            const getFn = l => {
              const m = String(l.date || '').match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
              return `lesson-${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}.html`;
            };

            const prevHtml = older ? `<a href="./${getFn(older)}" class="nav-btn">👈 前の記事 (${older.date})</a>` : '';
            const nextHtml = newer ? `<a href="./${getFn(newer)}" class="nav-btn">次の記事 (${newer.date}) 👉</a>` : '';
            const navHtml = `<nav class="nav-buttons" style="display:flex; justify-content:space-between; margin:20px 0; gap:10px;">${prevHtml}<a href="./" class="nav-btn">🏠 ブログ一覧</a>${nextHtml}</nav>`;

            fileContent = fileContent.replace(/<nav\s+class="nav-buttons">[\s\S]*?<\/nav>/gi, '');
            fileContent = fileContent.replace(/(<article\b[^>]*>)/i, `${navHtml}\n$1`);
            fileContent = fileContent.replace(/(<\/article>)/i, `$1\n${navHtml}`);
            fs.writeFileSync(targetFile, fileContent, 'utf8');
          });
          EOF

      - name: Clean Temporary Files
        run: rm -f payload.b64

      - name: Commit and Push All Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto update index.html blog list and navigation"
            git push
          fi
