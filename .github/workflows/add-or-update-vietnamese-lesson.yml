name: Add or Update Vietnamese Lesson

on:
  workflow_dispatch:
    inputs:
      lesson_json:
        description: "レッスン内容（JSON）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-or-update-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create builder script
        run: |
          cat << 'EOF' > build-lesson.js
          const fs = require("fs");
          const rawB64 = fs.readFileSync("payload.b64", "utf8").trim();
          let rawStr = Buffer.from(rawB64, "base64").toString("utf8").trim();
          rawStr = rawStr.replace(/\]\s*;?\s*$/, "").trim();
          if (rawStr.startsWith("[")) rawStr = rawStr.substring(1).trim();

          let input;
          try {
            input = JSON.parse(rawStr);
          } catch (e) {
            const s = rawStr.indexOf("{");
            const en = rawStr.lastIndexOf("}");
            input = JSON.parse(rawStr.substring(s, en + 1));
          }

          const m = String(input.date || "").match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
          if (!m) throw new Error("日付形式エラー");
          const targetFn = `lesson-${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}.html`;

          // 1. テンプレートとして10/12を使用（なければ作成）
          if (!fs.existsSync(targetFn) && fs.existsSync("lesson-2026-10-12.html")) {
            fs.copyFileSync("lesson-2026-10-12.html", targetFn);
          }

          // 2. HTMLコンテンツ全体の動的生成
          if (fs.existsSync(targetFn)) {
            let content = fs.readFileSync(targetFn, "utf8");

            // ヘッダー・タイトル・日付
            content = content.replace(/<title>[\s\S]*?<\/title>/i, `<title>🍓 ${input.title}｜一期一語</title>`);
            content = content.replace(/<div class="date-main">[\s\S]*?<\/div>/i, `<div class="date-main">🍓 ${input.date}</div>`);
            content = content.replace(/<h1>[\s\S]*?<\/h1>/i, `<h1>🍓 ${input.title}</h1>`);

            // エッセイ本文セクション（例文・単語分解の縦並びカード形式）の組み立て
            let sectionsHtml = "";
            if (Array.isArray(input.articleSections)) {
              input.articleSections.forEach(sec => {
                sectionsHtml += `<p><strong>${sec.heading}</strong></p>\n`;
                if (Array.isArray(sec.paragraphs)) {
                  sec.paragraphs.forEach(p => {
                    sectionsHtml += `<p>${p}</p>\n`;
                  });
                }
                if (Array.isArray(sec.examples)) {
                  sec.examples.forEach(ex => {
                    sectionsHtml += `
                      <div class="viet-card" style="margin: 15px 0; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #eee;">
                        <div class="viet-line" lang="vi" style="font-weight: bold; font-size: 1.1em; color: #2c3e50;">${ex.v}</div>
                        <div class="translation" style="margin: 4px 0 10px 0; color: #e74c3c;">日本語訳：${ex.j}</div>`;
                    
                    if (ex.w) {
                      // 解説文中の改行を綺麗に分割して縦並び表示にする
                      const lines = ex.w.split("\n");
                      lines.forEach(line => {
                        if (line.trim()) {
                          sectionsHtml += `<div style="margin: 6px 0; padding-left: 10px; border-left: 3px solid #ffb6c1; font-size: 0.95em;">${line}</div>\n`;
                        }
                      });
                    }

                    sectionsHtml += `
                        <button class="speak" type="button" onclick="speakVietnamese('${ex.v}')" style="margin-top: 8px;">🔊 聴く</button>
                      </div>\n`;
                  });
                }
              });
            }

            // メイン単語エリア
            let mainWordHtml = `
              <div class="viet-card">
                <div class="viet-line" lang="vi">${input.mainWord || ''}</div>
                <div class="translation">日本語訳：${input.mainMeaning || ''}</div>
                <button class="speak" type="button" onclick="speakVietnamese('${input.mainWord || ''}')">🔊 聴く</button>
              </div>
              <div class="viet-card">
                <div class="viet-line" lang="vi">${input.vietnamese || ''}</div>
                <div class="translation">日本語訳：${input.translation || ''}</div>
                <button class="speak" type="button" onclick="speakVietnamese('${input.vietnamese || ''}')">🔊 聴く</button>
              </div>`;

            // 単語テーブル
            let tableRows = "";
            if (Array.isArray(input.words)) {
              input.words.forEach(w => {
                const vn = Array.isArray(w) ? w[0] : w.v;
                const jp = Array.isArray(w) ? w[1] : w.j;
                tableRows += `
                  <tr>
                    <td><strong>${vn}</strong></td>
                    <td>${jp}</td>
                    <td><button class="speak" type="button" onclick="speakVietnamese('${vn}')">🔊 聴く</button></td>
                  </tr>\n`;
              });
            }

            // <article class="article">の中身を置き換え
            const articleRegex = /(<article class="article">)[\s\S]*?(<\/article>)/i;
            if (articleRegex.test(content)) {
              const newArticleContent = `
                <div class="date">
                  <div class="date-main">🍓 ${input.date}</div>
                  <div>ベトナム語の旅 🍓 もっと一期一語</div>
                </div>
                <h1>🍓 ${input.title}</h1>

                <div class="intro">
                  ${sectionsHtml}
                  <p style="text-align: center; font-weight: bold; color: #d83d76; font-size: 18px; margin-top: 20px;">🍓 一期一語 🍓</p>
                </div>

                <hr class="divider">
                <h2>🇻🇳 今日のメイン単語：${input.mainWord || ''}</h2>
                ${mainWordHtml}

                <hr class="divider">
                <h2>📚 単語一覧</h2>
                <table>
                  <thead>
                    <tr>
                      <th>ベトナム語</th>
                      <th>日本語の意味</th>
                      <th>音声</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${tableRows}
                  </tbody>
                </table>

                <section class="archive" aria-label="別の日のブログ">
                  <h2>📅 前後のブログ</h2>
                  <p>近くの日のベトナム語日記も読んでみよう！🍓</p>
                  <div style="text-align: center; margin-top: 15px;">
                    <a href="./archive.html" style="display: inline-block; padding: 10px 20px; background: #d83d76; color: #fff; border-radius: 12px; text-decoration: none; font-weight: bold;">📖 全てのブログ一覧を見る</a>
                  </div>
                  <p class="archive-home" style="text-align: center; margin-top: 15px;">
                    <a href="./index.html">🍓 トップページへ</a>　<a href="./words.html">📚 単語帳へ</a>
                  </p>
                </section>`;

              content = content.replace(articleRegex, `$1\n${newArticleContent}\n$2`);
            }

            fs.writeFileSync(targetFn, content, "utf8");
          }

          // 3. lessons.js の更新と保持
          let lessons = [];
          if (fs.existsSync("lessons.js")) {
            try {
              const src = fs.readFileSync("lessons.js", "utf8");
              const match = src.match(/const\s+lessons\s*=\s*(\[[\s\S]*\]);?/);
              if (match) lessons = JSON.parse(match[1]);
            } catch (err) {}
          }

          const idx = lessons.findIndex(l => l.date === input.date);
          if (idx >= 0) {
            lessons[idx] = { ...lessons[idx], ...input };
          } else {
            lessons.push(input);
          }

          lessons.sort((a, b) => {
            const getNum = d => {
              const pm = String(d || "").match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
              return pm ? Number(`${pm[1]}${pm[2].padStart(2, "0")}${pm[3].padStart(2, "0")}`) : 0;
            };
            return getNum(b.date) - getNum(a.date);
          });

          fs.writeFileSync("lessons.js", `const lessons = ${JSON.stringify(lessons, null, 2)};\n`, "utf8");
          EOF

      - name: Run Builder Script
        env:
          LESSON_JSON: ${{ inputs.lesson_json }}
        run: |
          echo "$LESSON_JSON" | base64 -w 0 > payload.b64
          node build-lesson.js

      - name: Clean
        run: rm -f payload.b64 build-lesson.js

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Restore vertical decomposed word card layout"
            git push
          fi
