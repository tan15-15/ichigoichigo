name: Add or Update Vietnamese Lesson

on:
  workflow_dispatch:
    inputs:
      lesson_json:
        description: "レッスン内容（JSONを丸ごと1回貼り付け）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-or-update-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Update Script
        env:
          LESSON_JSON: ${{ inputs.lesson_json }}
        run: |
          echo "$LESSON_JSON" | base64 -w 0 > payload.b64
          node -e '
            const fs = require("fs");
            const rawB64 = fs.readFileSync("payload.b64", "utf8").trim();
            let rawStr = Buffer.from(rawB64, "base64").toString("utf8").trim();
            rawStr = rawStr.replace(/\]\s*;?\s*$/, "").trim();
            if (rawStr.startsWith("[")) rawStr = rawStr.substring(1).trim();

            let input;
            try {
              input = JSON.parse(rawStr);
            } catch (e) {
              const s = rawStr.indexOf("{");
              const en = rawStr.lastIndexOf("}");
              input = JSON.parse(rawStr.substring(s, en + 1));
            }

            const m = String(input.date || "").match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
            if (!m) throw new Error("日付形式エラー");
            const targetFn = `lesson-${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}.html`;

            // 10/12をテンプレートにしてコピー
            if (!fs.existsSync(targetFn) && fs.existsSync("lesson-2026-10-12.html")) {
              fs.copyFileSync("lesson-2026-10-12.html", targetFn);
            }

            // lessons.js の更新
            let lessons = [];
            if (fs.existsSync("lessons.js")) {
              try {
                const src = fs.readFileSync("lessons.js", "utf8");
                const match = src.match(/const\s+lessons\s*=\s*(\[[\s\S]*\]);?/);
                if (match) lessons = JSON.parse(match[1]);
              } catch (err) {}
            }

            if (!lessons.some(l => l.date === "2026年10月120日") && fs.existsSync("lesson-2026-10-12.html")) {
              if (!lessons.some(l => l.date === "2026年10月12日")) {
                lessons.push({
                  date: "2026年10月12日",
                  title: "🍓 vớiは英語のwithみたい！「〜といっしょに」を覚えよう",
                  mainWord: "với",
                  mainMeaning: "〜と、〜といっしょに"
                });
              }
            }

            const idx = lessons.findIndex(l => l.date === input.date);
            if (idx >= 0) {
              lessons[idx] = { ...lessons[idx], ...input };
            } else {
              lessons.push(input);
            }

            lessons.sort((a, b) => (b.date || "").replace(/[^0-9]/g, "").localeCompare((a.date || "").replace(/[^0-9]/g, "")));
            fs.writeFileSync("lessons.js", `const lessons = ${JSON.stringify(lessons, null, 2)};\n`, "utf8");

            // 全ページのナビとアーカイブを連動更新
            lessons.forEach((l, i) => {
              const dm = String(l.date || "").match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
              if (!dm) return;
              const fn = `lesson-${dm[1]}-${dm[2].padStart(2, "0")}-${dm[3].padStart(2, "0")}.html`;
              if (!fs.existsSync(fn)) return;

              let content = fs.readFileSync(fn, "utf8");
              const newer = i > 0 ? lessons[i - 1] : null;
              const older = i < lessons.length - 1 ? lessons[i + 1] : null;

              const getFn = item => {
                const im = String(item.date || "").match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
                return `lesson-${im[1]}-${im[2].padStart(2, "0")}-${im[3].padStart(2, "0")}.html`;
              };

              const prevBtn = older ? `<a href="./${getFn(older)}" class="nav-btn">👈 前の記事 (${older.date})</a>` : "<span></span>";
              const nextBtn = newer ? `<a href="./${getFn(newer)}" class="nav-btn">次の記事 (${newer.date}) 👉</a>` : "<span></span>";
              const navHtml = `<nav class="nav-buttons">\n    ${prevBtn}\n    <a href="./" class="nav-btn">🏠 トップページへ戻る</a>\n    ${nextBtn}\n  </nav>`;

              content = content.replace(/<nav\s+class="nav-buttons">[\s\S]*?<\/nav>/gi, navHtml);
              fs.writeFileSync(fn, content, "utf8");
            });
          '

      - name: Clean
        run: rm -f payload.b64

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Simple reliable update"
            git push
          fi
