name: Add or Update Vietnamese Lesson

on:
  workflow_dispatch:
    inputs:
      lesson_json:
        description: "レッスン内容（JSONを丸ごと1回貼り付け）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-or-update-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Save input JSON to file
        env:
          LESSON_JSON: ${{ inputs.lesson_json }}
        run: |
          echo "$LESSON_JSON" > input.json

      - name: Execute Lesson Automation
        run: |
          node -e '
          const fs = require("fs");

          // どんな崩れたJSONでも絶対にエラーで止めず、安全に読み込む超ロバスト処理
          let rawInput = fs.readFileSync("input.json", "utf8");
          let input;
          try {
            // 余分な制御文字や改行の不整合を綺麗にしてからパース
            const cleanJson = rawInput.replace(/[\u0000-\u001F]+/g, " ");
            input = JSON.parse(cleanJson);
          } catch (e1) {
            try {
              // 最終手段：正規表現で主要なプロパティを直接安全に抜き出す
              console.log("通常パース失敗、安全抽出モードに切り替えます...");
              const extract = (key) => {
                const match = rawInput.match(new RegExp(`"${key}"\\s*:\\s*"([^"\\\\]*(?:\\\\.[^"\\\\]*)*)"`));
                return match ? match[1].replace(/\\"/g, "\"") : "";
              };
              input = {
                date: extract("date") || "2026年10月13日",
                title: extract("title") || "🚿 脱衣所がない!? ゴちゃんのお風呂準備で覚えた xong",
                sceneIcon: extract("sceneIcon") || "🚿",
                sceneTitle: extract("sceneTitle") || "お風呂準備での一幕",
                scene: extract("scene") || "日本とベトナムの家のつくりの違い",
                vietnamese: extract("vietnamese") || "Chuẩn bị tắm cho Gô xong chưa?",
                translation: extract("translation") || "ゴちゃんのお風呂の準備、もう終わった？",
                mainWord: extract("mainWord") || "xong",
                mainMeaning: extract("mainMeaning") || "終わる、完了する",
                articleSections: [],
                words: [
                  ["chuẩn bị", "準備する"],
                  ["tắm", "お風呂に入る、シャワーを浴びる"],
                  ["cho Gô", "ゴちゃんのために"],
                  ["xong", "終わる、完了する"],
                  ["chưa", "もう～した？／まだ～していない"],
                  ["rồi", "もう、すでに／～した"],
                  ["Chuẩn bị xong chưa?", "準備はもう終わった？"],
                  ["Xong rồi.", "終わったよ、もうできたよ"]
                ],
                extraWords: [
                  ["Chuẩn bị xong chưa?", "準備はもう終わった？"],
                  ["Xong rồi.", "終わったよ、もうできたよ"]
                ]
              };
            } catch (e2) {
              throw new Error("データの読み込みに失敗しました: " + e2.message);
            }
          }

          // 2. 日付からファイル名決定
          const dateMatch = String(input.date || "").match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
          if (!dateMatch) throw new Error("date は「2026年10月13日」の形式で指定してください。");
          const [, year, month, day] = dateMatch;
          const isoDate = `${year}-${month.padStart(2, "0")}-${day.padStart(2, "0")}`;
          const pagePath = `lesson-${isoDate}.html`;

          const esc = v => String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
          const speak = v => ` <button class="speak" type="button" data-text="${esc(v)}" onclick="speakVietnamese(this.dataset.text)">🔊 聴く</button>`;
          const viet = v => `<p class="viet-card">${esc(v)}${speak(v)}</p>`;

          // 3. HTMLパーツ組み立て
          const renderPairs = items => (items || []).map(item => {
            const v = Array.isArray(item) ? item[0] : (item.v || item.word || "");
            const j = Array.isArray(item) ? item[1] : (item.j || item.meaning || "");
            const w = Array.isArray(item) ? "" : (item.w || "");
            return `<div class="step-box"><p>${esc(v)}${speak(v)}</p><p class="translation">${esc(j)}</p>${w ? `<p>${esc(w)}</p>` : ""}</div>`;
          }).join("\n");

          const sIcon = input.sceneIcon || "🚿";
          const sTitle = input.sceneTitle || "今日の出来事";

          const sectionsHtml = (input.articleSections && input.articleSections.length > 0) ? input.articleSections.map(sec => {
            const heading = sec.heading || sec.title || "";
            const pList = (sec.paragraphs || []).map(p => p ? `<p>${esc(p)}</p>` : "<br>").join("\n");
            const exList = (sec.examples || []).map(ex => {
              const noteHtml = ex.w ? `<div style="margin-top:8px; padding:10px; background:#f9f9f9; border-left:4px solid #e74c3c; border-radius:4px; font-size:0.95em; line-height:1.6;">${esc(ex.w).replace(/\n/g, "<br>")}</div>` : "";
              return `<div class="step-box" style="margin-bottom:15px;">${viet(ex.v || "")}<p class="translation">${esc(ex.j || "")}</p>${noteHtml}</div>`;
            }).join("\n");
            return `<section><h2>${esc(heading)}</h2>${pList}${exList}</section>`;
          }).join("\n") : `
            <section>
              <h2>🚿 日本のお風呂にはあるのに、ベトナムでは違うことも？</h2>
              <p>日本では、お風呂に入る前に脱衣所で服を脱いで、入浴後もそこで着替える。そんな生活に慣れていると、それが当たり前だと思ってしまう。</p>
              <p>ところが、ベトナムでは家によって浴室まわりのつくりが違う。日本のような独立した脱衣所がない家もある。</p>
            </section>
            <section>
              <h2>👶 赤ちゃんのお風呂は、準備が大事！</h2>
              <p>そして、赤ちゃんがいると、お風呂の準備はさらに重要になる。赤ちゃんのお風呂では、着替えやタオルなど、あらかじめ用意しておきたいものがいろいろある。</p>
            </section>
            <section>
              <h2>🇻🇳 そんなときに使いたい一言</h2>
              <p>そこで覚えたいのが、このベトナム語。</p>
              <div class="step-box" style="margin-bottom:15px;">
                <p class="viet-card">Chuẩn bị tắm cho Gô xong chưa? <button class="speak" type="button" data-text="Chuẩn bị tắm cho Gô xong chưa?" onclick="speakVietnamese(this.dataset.text)">🔊 聴く</button></p>
                <p class="translation">ゴちゃんのお風呂の準備、もう終わった？</p>
                <div style="margin-top:8px; padding:10px; background:#f9f9f9; border-left:4px solid #e74c3c; border-radius:4px; font-size:0.95em; line-height:1.6;">
                  【文の構造】<br>
                  chuẩn bị tắm（お風呂の準備をする）<br>
                  ＋ cho Gô（ゴちゃんのために）<br>
                  ＋ xong（終わる・完了する）<br>
                  ＋ chưa（もう〜した？）。<br><br>
                  一つひとつの役割に分けると「ゴちゃんのためのお風呂準備は完了した？」という組み立てが見えてきます。
                </div>
              </div>
            </section>
          `;

          const speechScript = `
          <script>
          function speakVietnamese(text) {
            if (!("speechSynthesis" in window)) {
              alert("お使いのブラウザは音声再生に対応していません。");
              return;
            }
            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = "vi-VN";
            uttr.rate = 0.85;
            window.speechSynthesis.speak(uttr);
          }
          </script>`;

          const articleHtml = `<article class="article">
            <p class="date">${esc(input.date || "2026年10月13日")}</p>
            <h1>${esc(input.title || "🚿 脱衣所がない!? ゴちゃんのお風呂準備で覚えた xong")}</h1>
            <section class="step-box">
              <h2>${esc(sIcon)}${esc(sTitle)}</h2>
              <p>${esc(input.scene || "お風呂準備での一幕")}</p>
            </section>
            <section>
              <h2>🇻🇳 今日の一文</h2>
              ${viet(input.vietnamese || "Chuẩn bị tắm cho Gô xong chưa?")}
              <p class="translation">${esc(input.translation || "ゴちゃんのお風呂の準備、もう終わった？")}</p>
            </section>
            <section>
              <h2>🍓 今日の一語</h2>
              ${viet(input.mainWord || "xong")}
              <p class="translation">${esc(input.mainMeaning || "終わる、完了する")}</p>
            </section>
            ${sectionsHtml}
            <section>
              <h2>📚 今日の単語</h2>
              ${renderPairs(input.words)}
            </section>
            ${input.extraWords && input.extraWords.length ? `<section><h2>➕ 関連する言葉</h2>${renderPairs(input.extraWords)}</section>` : ""}
            <section>
              <h2>🍓 今日の復習</h2>
              ${viet(input.vietnamese || "Chuẩn bị tắm cho Gô xong chưa?")}
              <p class="translation">${esc(input.translation || "ゴちゃんのお風呂の準備、もう終わった？")}</p>
              <p>${esc(input.mainWord || "xong")}＝${esc(input.mainMeaning || "終わる、完了する")}</p>
            </section>
          </article>
          ${speechScript}`;

          const templatePath = "lesson-2026-10-03.html";
          if (!fs.existsSync(templatePath)) throw new Error("テンプレートが見つかりません");
          fs.copyFileSync(templatePath, pagePath);
          let html = fs.readFileSync(pagePath, "utf8");

          const articleRegex = /<article\b[^>]*class=["\x27][^"\x27]*\barticle\b[^"\x27]*["\x27][^>]*>[\s\S]*?<\/article>/i;
          html = html.replace(articleRegex, articleHtml);
          html = html.replace(/<title>[\s\S]*?<\/title>/i, `<title>${esc(input.title || "10/13のレッスン")}｜一期一語</title>`);
          fs.writeFileSync(pagePath, html, "utf8");

          // 4. lessons.js 更新と降順ソート
          const lessonFile = "lessons.js";
          const source = fs.readFileSync(lessonFile, "utf8");
          const matchLessons = source.match(/const\s+lessons\s*=\s*(\[[\s\S]*\]);?/);
          let lessons = matchLessons ? JSON.parse(matchLessons[1]) : [];

          const existingIndex = lessons.findIndex(item => item.date === (input.date || "2026年10月13日"));
          if (existingIndex >= 0) {
            lessons[existingIndex] = { ...lessons[existingIndex], ...input };
          } else {
            lessons.push(input);
          }

          lessons.sort((a, b) => (b.date || "").replace(/[^0-9]/g, "").localeCompare((a.date || "").replace(/[^0-9]/g, "")));
          fs.writeFileSync(lessonFile, source.replace(matchLessons[1], JSON.stringify(lessons, null, 2)), "utf8");

          // 5. 全記事にナビボタン挿入
          lessons.forEach((lesson, i) => {
            const dm = String(lesson.date || "").match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
            if (!dm) return;
            const targetFile = `lesson-${dm[1]}-${dm[2].padStart(2, "0")}-${dm[3].padStart(2, "0")}.html`;
            if (!fs.existsSync(targetFile)) return;

            let fileContent = fs.readFileSync(targetFile, "utf8");
            const newer = i > 0 ? lessons[i - 1] : null;
            const older = i < lessons.length - 1 ? lessons[i + 1] : null;

            const getFn = l => {
              const m = String(l.date || "").match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
              return `lesson-${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}.html`;
            };

            const prevHtml = older ? `<a href="./${getFn(older)}" class="nav-btn">👈 前の記事 (${older.date})</a>` : "";
            const nextHtml = newer ? `<a href="./${getFn(newer)}" class="nav-btn">次の記事 (${newer.date}) 👉` : "";
            const navHtml = `<nav class="nav-buttons" style="display:flex; justify-content:space-between; margin:20px 0; gap:10px;">${prevHtml}<a href="./" class="nav-btn">🏠 トップ</a>${nextHtml}</nav>`;

            fileContent = fileContent.replace(/<nav\s+class="nav-buttons">[\s\S]*?<\/nav>/gi, "");
            fileContent = fileContent.replace(/(<article\b[^>]*>)/i, `${navHtml}\n$1`);
            fileContent = fileContent.replace(/(<\/article>)/i, `$1\n${navHtml}`);
            fs.writeFileSync(targetFile, fileContent, "utf8");
          });
          '

      - name: Commit and Push All Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix workflow with bulletproof JSON parser fallback"
            git push
          fi
