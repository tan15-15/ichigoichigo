name: Add or Update Vietnamese Lesson

on:
  workflow_dispatch:
    inputs:
      lesson_json:
        description: "レッスン内容（JSON）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-or-update-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create builder script
        run: |
          cat << 'EOF' > build-lesson.js
          const fs = require("fs");
          const rawB64 = fs.readFileSync("payload.b64", "utf8").trim();
          let rawStr = Buffer.from(rawB64, "base64").toString("utf8").trim();
          rawStr = rawStr.replace(/\]\s*;?\s*$/, "").trim();
          if (rawStr.startsWith("[")) rawStr = rawStr.substring(1).trim();

          let input;
          try {
            input = JSON.parse(rawStr);
          } catch (e) {
            const s = rawStr.indexOf("{");
            const en = rawStr.lastIndexOf("}");
            input = JSON.parse(rawStr.substring(s, en + 1));
          }

          const m = String(input.date || "").match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
          if (!m) throw new Error("日付形式エラー");
          const yyyy = m[1];
          const mm = m[2].padStart(2, "0");
          const dd = m[3].padStart(2, "0");
          const targetFn = `lesson-${yyyy}-${mm}-${dd}.html`;

          // 1. テンプレートファイルの準備
          if (!fs.existsSync(targetFn) && fs.existsSync("lesson-2026-10-12.html")) {
            fs.copyFileSync("lesson-2026-10-12.html", targetFn);
          }

          // 2. lessons.js の読み込み・更新（最新3件取得の準備）
          let lessons = [];
          if (fs.existsSync("lessons.js")) {
            try {
              const src = fs.readFileSync("lessons.js", "utf8");
              const match = src.match(/const\s+lessons\s*=\s*(\[[\s\S]*\]);?/);
              if (match) lessons = JSON.parse(match[1]);
            } catch (err) {}
          }

          const idx = lessons.findIndex(l => l.date === input.date);
          if (idx >= 0) {
            lessons[idx] = { ...lessons[idx], ...input };
          } else {
            lessons.push(input);
          }

          // 日付の降順（新しい順）にソート
          lessons.sort((a, b) => {
            const getNum = d => {
              const pm = String(d || "").match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
              return pm ? Number(`${pm[1]}${pm[2].padStart(2, "0")}${pm[3].padStart(2, "0")}`) : 0;
            };
            return getNum(b.date) - getNum(a.date);
          });

          fs.writeFileSync("lessons.js", `const lessons = ${JSON.stringify(lessons, null, 2)};\n`, "utf8");

          // 3. 「最近のブログ（最新3件）」HTMLブロックの生成
          let recentLessonsHtml = '<ul style="list-style: none; padding: 0; margin: 15px 0;">';
          const recentItems = lessons.slice(0, 3);
          recentItems.forEach(item => {
            const im = String(item.date || "").match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
            if (im) {
              const fn = `lesson-${im[1]}-${im[2].padStart(2, "0")}-${im[3].padStart(2, "0")}.html`;
              const isCurrent = (fn === targetFn);
              const badge = isCurrent ? ' <span style="font-size:0.8em; background:#d83d76; color:#fff; padding:2px 6px; border-radius:4px; margin-left:5px;">この記事</span>' : '';
              recentLessonsHtml += `
                <li style="margin-bottom: 12px; padding: 12px; background: #fff; border: 1px solid #ffe0e9; border-radius: 8px;">
                  <a href="./${fn}" style="text-decoration: none; color: #d83d76; font-weight: bold; font-size: 1.05em; display: block;">
                    📅 ${item.date}：${item.title}${badge}
                  </a>
                </li>`;
            }
          });
          recentLessonsHtml += '</ul>';

          // 4. HTMLページの置換と生成
          if (fs.existsSync(targetFn)) {
            let content = fs.readFileSync(targetFn, "utf8");

            content = content.replace(/<title>[\s\S]*?<\/title>/i, `<title>🍓 ${input.title}｜一期一語</title>`);
            content = content.replace(/<div class="date-main">[\s\S]*?<\/div>/i, `<div class="date-main">🍓 ${input.date}</div>`);
            content = content.replace(/<h1>[\s\S]*?<\/h1>/i, `<h1>🍓 ${input.title}</h1>`);

            const formatText = (text) => text ? String(text).replace(/\n/g, "<br>") : "";

            // 文章セクション（記事本文）
            let sectionsHtml = "";
            if (Array.isArray(input.articleSections)) {
              input.articleSections.forEach(sec => {
                sectionsHtml += `<p><strong>${sec.heading}</strong></p>\n`;
                if (Array.isArray(sec.paragraphs)) {
                  sec.paragraphs.forEach(p => {
                    sectionsHtml += `<p>${p}</p>\n`;
                  });
                }
                if (Array.isArray(sec.examples)) {
                  sec.examples.forEach(ex => {
                    const wordMeaningHtml = ex.w ? `<div style="margin-top: 10px; padding: 10px; background: #fdf2f4; border-radius: 6px; color: #2c3e50; font-size: 0.95em; line-height: 1.6;">${formatText(ex.w)}</div>` : '';
                    sectionsHtml += `
                      <div class="viet-card" style="margin: 15px 0; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #eee;">
                        <div class="viet-line" lang="vi" style="font-weight: bold; font-size: 1.2em; color: #e74c3c;">${ex.v}</div>
                        <div class="translation" style="margin: 6px 0; color: #27ae60; font-weight: bold;">日本語訳：${ex.j}</div>
                        <button class="speak" type="button" onclick="speakVietnamese('${ex.v.replace(/'/g, "\\'")}')" style="margin: 6px 0 10px 0;">🔊 聴く</button>
                        ${wordMeaningHtml}
                      </div>\n`;
                  });
                }
              });
            }

            // 今日の一歩（BOX）
            let todayStepHtml = "";
            if (input.todayStep) {
              todayStepHtml = `
                <div style="margin: 25px 0; padding: 15px 20px; background: #fff0f5; border-left: 5px solid #d83d76; border-radius: 8px;">
                  <h3 style="margin: 0 0 8px 0; color: #d83d76; font-size: 1.1em;">🍓 今日の一歩🐾</h3>
                  <p style="margin: 0; color: #2c3e50; line-height: 1.6; font-weight: bold;">${formatText(input.todayStep)}</p>
                </div>`;
            }

            // 今日の一語（メイン単語エリア）
            let mainWordHtml = `
              <div class="viet-card" style="margin: 15px 0; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #eee;">
                <div class="viet-line" lang="vi" style="font-weight: bold; font-size: 1.2em; color: #e74c3c;">${input.vietnamese || input.mainWord || ''}</div>
                <div class="translation" style="margin: 6px 0; color: #27ae60; font-weight: bold;">日本語訳：${input.translation || input.mainMeaning || ''}</div>
                <button class="speak" type="button" onclick="speakVietnamese('${(input.vietnamese || input.mainWord || '').replace(/'/g, "\\'")}')" style="margin-top: 6px;">🔊 聴く</button>
              </div>`;

            // 単語一覧テーブル
            let tableRows = "";
            if (Array.isArray(input.words)) {
              input.words.forEach(w => {
                const vn = Array.isArray(w) ? w[0] : w.v;
                const jp = Array.isArray(w) ? w[1] : w.j;
                tableRows += `
                  <tr>
                    <td style="color: #e74c3c; font-weight: bold;">${vn}</td>
                    <td style="color: #2c3e50;">${jp}</td>
                    <td><button class="speak" type="button" onclick="speakVietnamese('${vn.replace(/'/g, "\\'")}')">🔊 聴く</button></td>
                  </tr>\n`;
              });
            }

            // <article class="article">の中身を置換
            const articleRegex = /(<article class="article">)[\s\S]*?(<\/article>)/i;
            if (articleRegex.test(content)) {
              const newArticleContent = `
                <div class="date">
                  <div class="date-main">🍓 ${input.date}</div>
                  <div>ベトナム語の旅 🍓 もっと一期一語</div>
                </div>
                <h1>🍓 ${input.title}</h1>

                <div class="intro">
                  ${sectionsHtml}
                  ${todayStepHtml}
                  <p style="text-align: center; font-weight: bold; color: #d83d76; font-size: 18px; margin-top: 20px;">🍓 一期一語 🍓</p>
                </div>

                <hr class="divider">
                <h2>🍓 今日の一語</h2>
                ${mainWordHtml}

                <hr class="divider">
                <h2>📚 単語一覧</h2>
                <table>
                  <thead>
                    <tr>
                      <th>ベトナム語</th>
                      <th>日本語の意味</th>
                      <th>音声</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${tableRows}
                  </tbody>
                </table>

                <section class="archive" aria-label="最近のブログ">
                  <h2>📚 最近のブログ</h2>
                  <p>直近のベトナム語日記も読んでみよう！🍓</p>
                  ${recentLessonsHtml}
                  <div style="text-align: center; margin-top: 15px;">
                    <a href="./archive.html" style="display: inline-block; padding: 10px 20px; background: #d83d76; color: #fff; border-radius: 12px; text-decoration: none; font-weight: bold;">📖 全てのブログ一覧を見る</a>
                  </div>
                  <p class="archive-home" style="text-align: center; margin-top: 15px;">
                    <a href="./index.html">🍓 トップページへ</a>　<a href="./words.html">📚 単語帳へ</a>
                  </p>
                </section>`;

              content = content.replace(articleRegex, `$1\n${newArticleContent}\n$2`);
            }

            fs.writeFileSync(targetFn, content, "utf8");
          }
          EOF

      - name: Run Builder Script
        env:
          LESSON_JSON: ${{ inputs.lesson_json }}
        run: |
          echo "$LESSON_JSON" | base64 -w 0 > payload.b64
          node build-lesson.js

      - name: Clean
        run: rm -f payload.b64 build-lesson.js

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update lesson builder with recent lessons list and formatting"
            git push
          fi
