name: Add or Update Vietnamese Lesson

on:
  workflow_dispatch:
    inputs:
      lesson_json:
        description: "レッスン内容（JSONを丸ごと1回貼り付け）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-or-update-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and Run Parser
        env:
          LESSON_JSON: ${{ inputs.lesson_json }}
        run: |
          echo "$LESSON_JSON" | base64 -w 0 > payload.b64

          node << 'EOF'
          const fs = require('fs');

          // 1. 入力JSONの復元
          const rawB64 = fs.readFileSync('payload.b64', 'utf8').trim();
          let rawStr = Buffer.from(rawB64, 'base64').toString('utf8').trim();
          rawStr = rawStr.replace(/\]\s*;?\s*$/, '').trim();
          if (rawStr.startsWith('[')) rawStr = rawStr.substring(1).trim();

          let input;
          try {
            input = JSON.parse(rawStr);
          } catch (e1) {
            const s = rawStr.indexOf('{');
            const e = rawStr.lastIndexOf('}');
            input = JSON.parse(rawStr.substring(s, e + 1));
          }

          // 2. 日付からファイル名決定
          const dateMatch = String(input.date || '').match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
          if (!dateMatch) throw new Error("日付形式が正しくありません");
          const [, y, m, d] = dateMatch;
          const isoDate = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
          const pagePath = `lesson-${isoDate}.html`;

          const esc = v => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

          // 3. lessons.js の読み込みと更新（過去の記事が消えないように完全な配列として維持）
          const lessonFile = 'lessons.js';
          let lessons = [];
          if (fs.existsSync(lessonFile)) {
            try {
              const source = fs.readFileSync(lessonFile, 'utf8');
              const matchLessons = source.match(/const\s+lessons\s*=\s*(\[[\s\S]*\]);?/);
              if (matchLessons && matchLessons[1]) lessons = JSON.parse(matchLessons[1]);
            } catch (err) { lessons = []; }
          }

          // 10月12日のデータがもしlessons.jsから抜けていれば自動的に再登録するセーフティネット
          const hasOct12 = lessons.some(item => item.date === "2026年10月12日");
          if (!hasOct12 && fs.existsSync("lesson-2026-10-12.html")) {
            lessons.push({
              "date": "2026年10月12日",
              "title": "🍓 vớiは英語のwithみたい！「〜といっしょに」を覚えよう",
              "mainWord": "với",
              "mainMeaning": "〜と、〜といっしょに",
              "vietnamese": "Ngủ với ba nha.",
              "translation": "パパといっしょに寝ようね。"
            });
          }

          const existingIndex = lessons.findIndex(item => item.date === input.date);
          if (existingIndex >= 0) {
            lessons[existingIndex] = { ...lessons[existingIndex], ...input };
          } else {
            lessons.push(input);
          }

          // 降順ソート（新しい日付が上）
          lessons.sort((a, b) => (b.date || '').replace(/[^0-9]/g, '').localeCompare((a.date || '').replace(/[^0-9]/g, '')));
          fs.writeFileSync(lessonFile, `const lessons = ${JSON.stringify(lessons, null, 2)};\n`, 'utf8');

          // 4. 10/12のテンプレートファイルをベースにして各個別ページ（HTML）を安全に生成・更新
          const templateFile = 'lesson-2026-10-12.html';
          if (!fs.existsSync(templateFile)) throw new Error("テンプレートファイル lesson-2026-10-12.html が見つかりません");

          lessons.forEach((currentLesson, idx) => {
            const dm = String(currentLesson.date || '').match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
            if (!dm) return;
            const targetFn = `lesson-${dm[1]}-${dm[2].padStart(2, '0')}-${dm[3].padStart(2, '0')}.html`;

            const newer = idx > 0 ? lessons[idx - 1] : null;
            const older = idx < lessons.length - 1 ? lessons[idx + 1] : null;

            const getFn = l => {
              const m = String(l.date || '').match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);
              return `lesson-${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}.html`;
            };

            // ナビボタン生成
            const prevBtn = older ? `<a href="./${getFn(older)}" class="nav-btn">👈 前の記事 (${esc(older.date)})</a>` : '<span></span>';
            const nextBtn = newer ? `<a href="./${getFn(newer)}" class="nav-btn">次の記事 (${esc(newer.date)}) 👉</a>` : '<span></span>';
            const navHtml = `<nav class="nav-buttons">\n    ${prevBtn}\n    <a href="./" class="nav-btn">🏠 トップページへ戻る</a>\n    ${nextBtn}\n  </nav>`;

            // アーカイブ生成
            const archiveItems = [];
            if (older) {
              archiveItems.push(`    <a href="./${getFn(older)}" class="archive-item-link">\n      <div class="archive-item-date">${esc(older.date)}</div>\n      <div class="archive-item-title">${esc(older.title)}</div>\n      <div class="archive-item-words">主要単語：${esc(older.mainWord || '')}</div>\n    </a>`);
            }
            if (newer) {
              archiveItems.push(`    <a href="./${getFn(newer)}" class="archive-item-link">\n      <div class="archive-item-date">${esc(newer.date)}</div>\n      <div class="archive-item-title">${esc(newer.title)}</div>\n      <div class="archive-item-words">主要単語：${esc(newer.mainWord || '')}</div>\n    </a>`);
            }

            const archiveHtml = `<section class="archive" aria-label="別の日のブログ">\n  <h2>📅 前後のブログ</h2>\n  <p>近くの日のベトナム語日記も読んでみよう！🍓</p>\n  <div class="archive-links">\n${archiveItems.join('\n')}\n  </div>\n  <div style="margin-top: 15px; text-align: center;">\n    <a href="./archive.html" style="display: inline-block; padding: 10px 20px; background: #d83d76; color: #fff; border-radius: 12px; text-decoration: none; font-weight: bold;">📖 全てのブログ一覧を見る</a>\n  </div>\n  <p class="archive-home" style="text-align: center; margin-top: 15px;">\n    <a href="./index.html">🍓 トップページへ</a>　<a href="./words.html">📚 単語帳へ</a>\n  </p>\n</section>`;

            if (!fs.existsSync(targetFn)) {
              fs.copyFileSync(templateFile, targetFn);
            }

            let html = fs.readFileSync(targetFn, 'utf8');

            html = html.replace(/<title>[\s\S]*?<\/title>/i, `<title>${esc(currentLesson.title)}｜一期一語</title>`);
            html = html.replace(/<nav\s+class="nav-buttons">[\s\S]*?<\/nav>/gi, navHtml);
            
            const dateBlock = `<div class="date">\n  <div class="date-main">🍓 ${esc(currentLesson.date)}</div>\n  <div>ベトナム語の旅 🍓 もっと一期一語</div>\n</div>`;
            html = html.replace(/<div\s+class="date">[\s\S]*?<\/div>\s*<\/div>/gi, dateBlock);
            html = html.replace(/<h1>[\s\S]*?<\/h1>/i, `<h1>🍓 ${esc(currentLesson.title)}</h1>`);
            html = html.replace(/<section\s+class="archive"\b[^>]*>[\s\S]*?<\/section>/gi, archiveHtml);

            fs.writeFileSync(targetFn, html, 'utf8');
          });
          EOF

      - name: Clean Temporary Files
        run: rm -f payload.b64

      - name: Commit and Push All Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix lessons.js population and archive list generation"
            git push
          fi
