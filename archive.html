<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブログ記事一覧 - 一期一語</title>
    <link rel="stylesheet" href="style.css">
    <style>
        header { position: relative; overflow: hidden; padding: 0; text-align: center; background: #fff5e9; border-bottom: 5px solid #d83d63; box-shadow: 0 5px 0 #fff0c4; }
        .site-banner { display: block; width: 100%; height: auto; max-height: 540px; object-fit: contain; margin: 0 auto; }
        .archive-page-container { max-width: 800px; margin: 30px auto; padding: 20px; background: #fff; border-radius: 20px; border: 2px solid #ffd0df; box-shadow: 0 4px 15px rgba(233,77,131,0.1); }
        .archive-page-title { text-align: center; color: #d83d76; margin-bottom: 25px; font-size: 24px; }
        .archive-list { display: flex; flex-direction: column; gap: 12px; }
        .archive-item { display: block; padding: 14px 18px; background: #fff9fb; border: 1.5px solid #ffc7d9; border-radius: 14px; text-decoration: none; transition: all 0.2s ease; }
        .archive-item:hover { background: #ffe8f0; transform: translateY(-2px); }
        .archive-date { font-size: 13px; color: #ba7c91; font-weight: bold; margin-bottom: 3px; }
        .archive-item-title { font-size: 16px; font-weight: bold; color: #a92758; }
        .archive-item-words { font-size: 13px; color: #80616e; margin-top: 3px; }
        .back-home { display: block; width: fit-content; margin: 25px auto 0; padding: 10px 20px; background: #ffdfeb; color: #92244d; border-radius: 999px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <header aria-label="一期一語のサイトタイトル">
        <img class="site-banner" src="site-banner.jpg" alt="一期一語">
    </header>
    <main class="archive-page-container">
        <h1 class="archive-page-title">🍓 ブログ記事一覧（全件）</h1>
        
        <!-- 自動生成される一覧エリア -->
        <div id="auto-archive-list" class="archive-list">
            <!-- JavaScriptで自動読み込みされます -->
        </div>

        <a href="./index.html" class="back-home">🍓 トップページへ戻る</a>
    </main>

    <!-- 記事データを管理するファイル -->
    <script src="lessons.js"></script>

    <script>
    (function(){
      var container = document.getElementById('auto-archive-list');
      if (typeof lessons !== 'undefined' && Array.isArray(lessons)) {
        // 新しい日付順に並び替え
        var sorted = lessons.slice().sort(function(a,b){
          return b.date.localeCompare(a.date);
        });

        var html = '';
        sorted.forEach(function(item){
          html += '<a class="archive-item" href="' + item.url + '">';
          html += '  <div class="archive-date">' + item.dateDisplay + '</div>';
          html += '  <div class="archive-item-title">' + item.title + '</div>';
          if(item.words) {
            html += '  <div class="archive-item-words">主要単語：' + item.words + '</div>';
          }
          html += '</a>';
        });
        container.innerHTML = html;
      } else {
        // 万が一lessons.jsが読めない場合の予備表示
        container.innerHTML = `
            <a class="archive-item" href="./lesson-2026-10-04.html">
                <div class="archive-date">2026年10月4日</div>
                <div class="archive-item-title">🛵 毎朝のバイク麺活！看板もメニューもないお店で「いくら？」と聞く</div>
                <div class="archive-item-words">主要単語：bát, này, nhiêu, tiền, mắc, rẻ</div>
            </a>
            <a class="archive-item" href="./lesson-2026-10-03.html">
                <div class="archive-date">2026年10月3日</div>
                <div class="archive-item-title">市場に行きたい！ ベトナム語を覚えて、いざ出発！</div>
                <div class="archive-item-words">主要単語：hôm nay, muốn, đi chợ, về nhà</div>
            </a>
        `;
      }
    })();
    </script>
</body>
</html>
