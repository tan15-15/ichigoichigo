<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>これまでの一語 🍓一期一語</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #fff7f8;
      color: #49363b;
      font-family: sans-serif;
    }
    header, main {
      max-width: 760px;
      margin: 0 auto;
    }
    header {
      padding: 22px;
      background: #fff;
      border: 2px solid #f4c8d2;
      border-radius: 22px;
      text-align: center;
    }
    h1 {
      color: #c83e61;
      margin: 0 0 8px;
      font-size: 1.7rem;
    }
    a { color: #b72f53; }
    .tools {
      display: grid;
      gap: 12px;
      margin: 22px 0;
    }
    input, select {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border: 1px solid #e5b8c4;
      border-radius: 12px;
      background: white;
      font-size: 1rem;
    }
    #words-list {
      display: grid;
      gap: 14px;
    }
    .word-card {
      padding: 18px;
      background: white;
      border: 1px solid #f0d1d9;
      border-radius: 18px;
    }
    .word-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .word-label {
      color: #b72f53;
      font-size: .85rem;
    }
    .word-card h2 {
      margin: 12px 0 4px;
      color: #9f2848;
      font-size: 1.6rem;
    }
    .word-meaning {
      margin: 0 0 14px;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .word-detail {
      margin: 9px 0 0;
      line-height: 1.6;
    }
    button {
      padding: 9px 12px;
      border: 0;
      border-radius: 10px;
      background: #fbe3e9;
      color: #8f2341;
      font-size: .95rem;
      cursor: pointer;
    }
    .empty-words {
      padding: 24px;
      background: white;
      border-radius: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍓 これまでの一語</h1>
    <p>少しずつ覚えたベトナム語を、ここで復習しよう。</p>
    <a href="index.html">← 今日のレッスンに戻る</a>
  </header>

  <main>
    <div class="tools">
      <input id="word-search" type="search"
        placeholder="ベトナム語・日本語で検索">
      <select id="word-category" aria-label="単語の種類"></select>
    </div>
    <div id="words-list"></div>
  </main>

  <script src="lessons.js"></script>
  <script src="words-page.js"></script>
</body>
</html>
