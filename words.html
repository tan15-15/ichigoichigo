<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <title>これまでの一語 🍓一期一語</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: #fff7f8;
      color: #49363b;
      font-family: "Noto Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.7;
    }
    header, main {
      max-width: 760px;
      margin: 0 auto;
    }
    header {
      padding: 22px;
      background: #fff;
      border: 2px solid #f4c8d2;
      border-radius: 22px;
      text-align: center;
    }
    h1 {
      color: #c83e61;
      margin: 0 0 8px;
      font-size: 1.6rem;
    }
    a { color: #b72f53; }
    .tools {
      display: grid;
      gap: 12px;
      margin: 20px 0;
    }
    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #e5b8c4;
      border-radius: 12px;
      background: white;
      font: inherit;
    }
    #words-list {
      display: grid;
      gap: 12px;
    }
    .word-card {
      padding: 17px;
      background: white;
      border: 1px solid #f0d1d9;
      border-radius: 18px;
    }
    .word-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .word-label {
      color: #b72f53;
      font-size: .85rem;
    }
    /* ベトナム語の単語・例文の太さを500に統一 */
    .word-card h2,
    .word-card [lang="vi"] {
      font-family: "Noto Sans", sans-serif;
      font-weight: 500;
      font-synthesis: none;
    }
    .word-card h2 {
      margin: 10px 0 4px;
      color: #9f2848;
      font-size: 1.6rem;
      line-height: 1.5;
    }
    .word-meaning {
      margin: 0 0 12px;
      font-size: 1rem;
    }
    .word-detail {
      margin: 9px 0 0;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    button {
      padding: 8px 11px;
      border: 0;
      border-radius: 10px;
      background: #fbe3e9;
      color: #8f2341;
      font: inherit;
      font-size: .9rem;
      cursor: pointer;
    }
    .empty-words {
      padding: 24px;
      background: white;
      border-radius: 16px;
      text-align: center;
    }
    @media (max-width: 600px) {
      body { padding: 10px; }
      header { padding: 18px 12px; }
      .word-card { padding: 14px; }
      .word-card h2 { font-size: 1.45rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🍓 これまでの一語</h1>
    <p>覚えた言葉を検索して、少しずつ復習しよう。</p>
    <a href="./index.html">← 今日のレッスンに戻る</a>
  </header>
  <main>
    <div class="tools">
      <input
        id="word-search"
        type="search"
        placeholder="ベトナム語・日本語の意味で検索"
        aria-label="単語を検索"
      >
      <select id="word-category" aria-label="単語の種類"></select>
    </div>
    <div id="words-list"></div>
  </main>
  <script src="lessons.js"></script>
  <script src="./vocabulary.js"></script>
  <script src="./words-page.js"></script>
</body>
</html>
